category: Feedback
tagline: "Open-source community feedback platform"
homepage: https://fider.io
test_env:
  EMAIL_NOREPLY: "noreply@fider.test"
  EMAIL_SMTP_HOST: "smtp.fider.test"
test_results:
  last_tested: 2026-10-03
  pull_time_seconds: 1
  startup_time_seconds: 107
  total_disk_mb: 891
  health_check_passed: false
  notes: "Containers running but health check timed out"
known_issues:
  - "Does not deploy. Upstream fider defect: its SQL logger inserts into logs(created_at)
    (app/services/log/sql/sql.go:77-80), while its migration creates the column as
    created_on (migrations/201806191904_create_logs.sql). LOG_SQL defaults to true
    (app/pkg/env/env.go:88), so it fires on every boot, on any Postgres major.
    Independent of the required env vars tracked in #231."
images:
  - name: getfider/fider:stable
    size_mb: 499
    platform:
      - linux/arm64
  - name: postgres:16-alpine
    size_mb: 392
    platform:
      - linux/arm64

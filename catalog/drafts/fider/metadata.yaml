category: Feedback
tagline: "Open-source community feedback platform"
homepage: https://fider.io
test_env:
  EMAIL_NOREPLY: "noreply@fider.test"
  EMAIL_SMTP_HOST: "smtp.fider.test"
test_results:
  last_tested: 2026-04-06
  pull_time_seconds: 3
  startup_time_seconds: 107
  total_disk_mb: 433
  health_check_passed: false
  notes: >-
    Blocked by an upstream fider defect: its SQL logger inserts into logs(created_at)
    while its migration creates the column as created_on, so Postgres logs
    'column "created_at" of relation "logs" does not exist'. The defect does not depend
    on the Postgres major version or on the required env vars (#231).
images:
  - name: getfider/fider:stable
    size_mb: 174
    platform:
      - linux/arm64
  - name: postgres:16-alpine
    size_mb: 259
    platform:
      - linux/arm64

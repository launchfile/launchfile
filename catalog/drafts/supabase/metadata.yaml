category: Backend
tagline: "Open-source Firebase alternative"
homepage: https://supabase.com
known_issues:
  - "No deploy has verified this draft. `studio.STUDIO_PG_META_URL` is declared
    `required:` with no value source, so the harness refuses the app before it
    starts. It is an HTTP URL for a pg-meta service this Launchfile does not
    declare, and there is no `postgres-meta` component to reference."
gaps:
  - "`auth.GOTRUE_JWT_SECRET` and `rest.PGRST_JWT_SECRET` are separate generated
    secrets. GoTrue signs tokens that PostgREST must verify, so they must be the
    same value. Sharing one top-level secret would fix it."
  - "`kong` has no declarative configuration, so it routes nothing to `auth`,
    `rest` or `realtime`."

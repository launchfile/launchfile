version: 2
updates:
  # Bun workspace root — covers sdk/, providers/*, and packages/*.
  # One entry, not one per member: bun keeps a single lockfile at the workspace
  # root, and that is the only lockfile it reads for any member. The bun
  # ecosystem (not npm) is required so dependabot regenerates ./bun.lock — an
  # npm-ecosystem PR bumps package.json alone, which fails CI's frozen-lockfile
  # install. Same reason the www-* entries below use bun.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  # www-dev (launchfile.dev)
  # bun ecosystem so dependabot regenerates bun.lock — npm-ecosystem PRs only
  # bumped package.json, which fails CI's frozen-lockfile install
  - package-ecosystem: bun
    directory: /www-dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro-ecosystem:
        patterns: ["astro", "@astrojs/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      other:
        patterns: ["*"]
        exclude-patterns: ["astro", "@astrojs/*", "tailwindcss", "@tailwindcss/*"]

  # www-org (launchfile.org)
  - package-ecosystem: bun
    directory: /www-org
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro-ecosystem:
        patterns: ["astro", "@astrojs/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      other:
        patterns: ["*"]
        exclude-patterns: ["astro", "@astrojs/*", "tailwindcss", "@tailwindcss/*"]

  # Catalog test harness
  - package-ecosystem: npm
    directory: /catalog/test
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns: ["*"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

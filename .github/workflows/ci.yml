name: CI

on:
  # Every pull request, whatever its base. A base filter of [main] silently
  # skips stacked PRs, which merge into a sibling branch and inherit no run
  # from it. Retargeting does not rescue them either: with no `types:` key
  # this runs on `opened`, `synchronize`, and `reopened` only, and a base
  # change is none of the three (`synchronize` tracks the head branch).
  # Nothing holds the filter up on the other side — CI reads no secret and
  # carries a read-only token, so a run costs minutes and nothing else.
  pull_request:
  # And every merge into main. A `pull_request` run tests `refs/pull/N/merge` —
  # the PR merged into main as main stood when that run started — so once main
  # moves, the result describes a tree that no longer exists. Two PRs green
  # against different bases can produce a broken main between them. This is the
  # only run that looks at the merged result.
  push:
    branches: [main]

# Least privilege: every job here only reads the checked-out code (build/test/
# validate). No job writes to the repo, comments, or deploys, so the workflow
# token needs nothing beyond read. (CodeQL: actions/missing-workflow-permissions.)
permissions:
  contents: read

jobs:
  sdk:
    name: SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: cd sdk && bun install --frozen-lockfile
      - run: cd sdk && bun run typecheck
      - run: cd sdk && bun run build
      - run: cd sdk && bun run test

  providers:
    name: "Provider (${{ matrix.provider }})"
    runs-on: ubuntu-latest
    needs: sdk
    strategy:
      matrix:
        provider: [docker, macos-dev, aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build SDK (local dependency)
        run: cd sdk && bun install --frozen-lockfile && bun run build
      - run: cd providers/${{ matrix.provider }} && bun install --frozen-lockfile
      - run: cd providers/${{ matrix.provider }} && bun run typecheck
      - run: cd providers/${{ matrix.provider }} && bun run test

  # The AWS provider is translation-only: prove the emitted HCL is valid Terraform
  # against the real AWS provider schema (no credentials — init only fetches the
  # schema). This is the conformance gate the unit tests can't give us: they
  # assert structure, terraform validate asserts the output actually parses.
  #
  # No `needs: sdk` — this job builds the SDK from source itself (~1s), so a
  # broken SDK fails it here with the same error. Gating on the sdk job only
  # added queue latency to the run's longest pole.
  aws-terraform-validate:
    name: "AWS provider — terraform validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Build SDK (local dependency)
        run: cd sdk && bun install --frozen-lockfile && bun run build
      - run: cd providers/aws && bun install --frozen-lockfile
      # Validate the emitted HCL for the stable spec examples. The community
      # catalog is validated locally (`bun run validate:tf`) — gating every
      # catalog PR on the whole catalog would make every catalog PR wait on a
      # third party's schema server. The plugin cache plus the script's shared
      # `terraform init` mean the AWS provider is downloaded and initialized
      # once per run, not once per example.
      - name: Validate emitted Terraform for spec examples
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          cd providers/aws && bun run validate:tf --examples

  cli:
    name: CLI
    runs-on: ubuntu-latest
    needs: [sdk, providers]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build SDK and providers (local dependencies)
        run: |
          cd sdk && bun install --frozen-lockfile && bun run build
          cd ../providers/docker && bun install --frozen-lockfile && bun run build
      - run: cd packages/launchfile && bun install --frozen-lockfile
      - run: cd packages/launchfile && bun run typecheck
      - run: cd packages/launchfile && bun run build
      - run: cd packages/launchfile && bun run test
      - name: Verify dist/cli.js exists
        run: test -f packages/launchfile/dist/cli.js || (echo "dist/cli.js missing!" && exit 1)

  websites:
    name: "Website (${{ matrix.site }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: www-dev
            term: validate
          - site: www-org
            term: components
            # www-org renders mermaid diagrams; www-dev has none (empty → skipped).
            mermaidPath: /design/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # www-shared carries the shared Sätteri markdown plugins; the site configs
      # import them, so its deps (satteri, hast/mdast types) must be installed
      # before the site build/typecheck can resolve them.
      - run: cd www-shared && bun install --frozen-lockfile
      - run: cd ${{ matrix.site }} && bun install --frozen-lockfile
      - run: cd ${{ matrix.site }} && bun run typecheck
      - run: cd ${{ matrix.site }} && bun run build
      # Chrome for Testing + the headless shell are ~9s of download per job, and
      # both matrix legs pay it. smoke-tests/bun.lock pins the Playwright
      # version, so it is the correct cache key: a version bump changes the
      # hash, misses, and re-downloads the matching browser build. Both legs
      # start together and miss together on a bump — one wins the save, the
      # other logs "cache already exists" and moves on.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('smoke-tests/bun.lock') }}
      # Functional search test against the freshly-built site, BEFORE deploy.
      # Site search broke for ~6 days after the Astro 6→7 bump because nothing
      # exercised it pre-merge — only the post-deploy smoke caught it, live.
      - name: Search + mermaid render on the built site
        working-directory: smoke-tests
        # Matrix values go through env (not inline ${{ }} in the run body), per
        # GitHub's injection-safe guidance — keeps the habit safe if an input is
        # ever swapped for untrusted data.
        env:
          SEARCH_SITE: ${{ matrix.site }}
          SEARCH_TERM: ${{ matrix.term }}
          SEARCH_BASE_URL: http://127.0.0.1:8080
          # Mermaid render gate (browser/mermaid.spec.ts). Only www-org has
          # diagrams; for www-dev MERMAID_PATH is empty and the spec registers
          # no tests. Catches a broken diagram render (e.g. the __VITE_PRELOAD__
          # throw, or a fence not emitted as <pre class="mermaid">) pre-deploy.
          MERMAID_SITE: ${{ matrix.site }}
          MERMAID_PATH: ${{ matrix.mermaidPath }}
          MERMAID_BASE_URL: http://127.0.0.1:8080
        run: |
          bun install --frozen-lockfile
          # No --with-deps: it spent ~16s per job on apt for nothing. On
          # ubuntu-latest every library Playwright asks for (libnss3, libcairo2,
          # libatk*, libasound2t64, …) is already the newest version; the only
          # packages it added were 21MB of CJK/Cyrillic/Thai fonts. Nothing here
          # asserts pixels — no toHaveScreenshot, no snapshots — and the one
          # geometry check is boundingBox().width > 0 on an English mermaid SVG.
          # If a future runner image drops a library, this fails loudly at
          # browser launch and the fix is to put the flag back.
          bunx playwright install chromium
          node serve-build.mjs "../$SEARCH_SITE/dist/client" 8080 &
          for i in $(seq 1 30); do curl -sf "$SEARCH_BASE_URL/" >/dev/null && break; sleep 0.5; done
          bunx playwright test browser/

  spec-citations:
    name: Spec Citations
    runs-on: ubuntu-latest
    # Reads issue state to tell a live tracker from a closed one. `contents` is
    # inherited as read; `issues: read` is the only addition this job needs.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forward-looking citations must name an open issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/lint-spec-citations.mjs spec --strict

  # Catches invalid YAML in workflow files before it gets merged and breaks
  # the CI/release pipeline. actionlint alone is not sufficient here — it
  # silently accepted the invalid release.yml that motivated this job (PR #23).
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflow YAML with strict parser
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(
              glob.glob('.github/workflows/*.yml')
              + glob.glob('.github/workflows/*.yaml')
          )
          failed = []
          for f in files:
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'  ok  {f}')
              except yaml.YAMLError as e:
                  failed.append((f, str(e)))
                  print(f'FAIL  {f}:\n{e}\n', file=sys.stderr)
          if failed:
              print(f'\n{len(failed)} workflow file(s) failed YAML validation', file=sys.stderr)
              sys.exit(1)
          print(f'\n{len(files)} workflow file(s) parsed cleanly')
          PY

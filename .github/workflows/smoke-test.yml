name: Smoke Tests

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to test (default: latest)"
        default: "latest"
  schedule:
    - cron: "0 8 * * 1-5" # Weekdays at 8am UTC
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "packages/**"
      - "providers/**"
      - "smoke-tests/**"

# Least-privilege default token: every job here only reads the repo
# (checkout) and uploads its own run artifacts. No write scopes needed.
permissions:
  contents: read

jobs:
  smoke-npm:
    name: "Smoke (Node ${{ matrix.node-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: smoke-tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Run smoke tests
        run: bash smoke-tests/run.sh
        env:
          SMOKE_TEST_VERSION: ${{ github.event.inputs.version || 'latest' }}

  smoke-websites:
    name: "Websites"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: smoke-tests
      - name: Website smoke tests
        run: bash smoke-tests/run.sh --websites-only

  smoke-browser:
    name: "Browser (Playwright)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: smoke-tests
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        working-directory: smoke-tests
        run: bun install
      - name: Install Playwright browsers
        working-directory: smoke-tests
        run: bunx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: smoke-tests
        run: bunx playwright test
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: smoke-tests/test-results/
          retention-days: 7

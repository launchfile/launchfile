name: Deploy launchfile.dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www-dev/**"
      - "www-shared/**"
      - "brand/**"
      - "sdk/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # www-shared carries the shared Sätteri markdown plugins; the site config
      # imports them, so its deps (satteri, hast/mdast types) must be installed
      # before the build can resolve them. Mirrors the CI websites job — keep
      # the two in step.
      - name: Install shared deps
        run: cd www-shared && bun install --frozen-lockfile
      - name: Install dependencies
        run: cd www-dev && bun install --frozen-lockfile
      - name: Build
        run: cd www-dev && bun run build
      - name: Deploy to Cloudflare Pages
        working-directory: www-dev
        run: bunx wrangler pages deploy dist/client --project-name=launchfile-dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
